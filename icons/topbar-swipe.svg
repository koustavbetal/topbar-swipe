<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4fd"/>
      <stop offset="1" stop-color="#cfe0f8"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2a33"/>
      <stop offset="1" stop-color="#1c1b22"/>
    </linearGradient>
    <linearGradient id="swipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#50a0ff" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#50a0ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#b8dcff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-150%" width="140%" height="400%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="barClip">
      <path d="M26 16h76a16 16 0 0 1 16 16v14H10V32a16 16 0 0 1 16-16z"/>
    </clipPath>
  </defs>
  <!-- drop shadow -->
  <rect x="10" y="20" width="108" height="96" rx="16" fill="#000" opacity="0.18"/>
  <!-- screen -->
  <rect x="10" y="16" width="108" height="96" rx="16" fill="url(#screen)"/>
  <!-- top bar -->
  <path d="M26 16h76a16 16 0 0 1 16 16v14H10V32a16 16 0 0 1 16-16z" fill="url(#bar)"/>
  <g clip-path="url(#barClip)">
    <!-- one continuous streak: clear tail on the left, bright head on the right -->
    <rect x="70" y="26" width="38" height="10" rx="5" fill="#50a0ff" filter="url(#glow)" opacity="0.9"/>
    <rect x="16" y="27" width="92" height="8" rx="4" fill="url(#swipe)"/>
    <rect x="94" y="28.5" width="12" height="5" rx="2.5" fill="#ffffff" opacity="0.7"/>
  </g>
  <!-- screen rim -->
  <rect x="10.5" y="16.5" width="107" height="95" rx="15.5" fill="none" stroke="#000" stroke-opacity="0.12"/>
</svg>
